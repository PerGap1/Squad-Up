{% extends 'base.html' %}

{% block content %}
    <h2>{{ object }}</h2>

    <p>{{ object.creator }}</p>
    <p>{{ object.description }}</p>
    <p>{{ object.released }}</p>

    {% if object.is_modified %}
        <p class="text-secondary">Modified</p>
    {% endif %}

    <a class="btn btn-outline-secondary" href="{% url 'games:game-update' object.pk %}">
        Update
    </a>
    <a class="btn btn-outline-danger" href="{% url 'games:game-delete' object.pk %}">
        Delete
    </a>
{% endblock %}
